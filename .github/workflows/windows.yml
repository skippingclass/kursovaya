name: Windows

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: pip
      - name: Test source
        run: |
          python -m pip install -r requirements-dev.txt
          python -m unittest discover -s tests -v
      - name: Check first launch
        run: cmd /c run.bat --check
      - name: Build portable archive
        if: github.event_name != 'pull_request'
        run: python scripts/package_windows.py
      - name: Test portable archive
        if: github.event_name != 'pull_request'
        run: |
          Expand-Archive dist/CollegeTeachers-Windows-x64.zip dist/check
          cmd /c dist\check\CollegeTeachers\run.bat --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & dist/check/CollegeTeachers/runtime/python.exe -B -m unittest discover -s tests -p test_ui.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & dist/check/CollegeTeachers/runtime/python.exe -B -m unittest discover -s tests -p test_network_client.py -v
      - uses: actions/upload-artifact@v7
        if: github.event_name != 'pull_request'
        with:
          path: dist/CollegeTeachers-Windows-x64.zip
          archive: false
